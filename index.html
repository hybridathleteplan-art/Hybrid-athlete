        <div>
          ${supersetIdx>=0?`<div class="tiny" style="color:var(--accent);text-transform:uppercase;letter-spacing:0.6px;font-weight:700;margin-bottom:2px;">${ordinal(supersetIdx+1)} exercise of superset</div>`:''}
          <div class="ex-name">${ex.name} ${isPlat?'<span class="plateau-badge">⚠ NO PROGRESS</span>':''}</div>
          <div class="ex-meta">${ex.muscle} ${e.weighted?'· Weighted':'· Bodyweight/Assisted'}</div>
          ${(()=>{ const last = lastSetsSummary(e.exerciseId, e.weighted); return last ? `<div class="tiny muted" style="margin-top:3px;">Last time (${fmtDate(last.date)}): ${last.text}</div>` : ''; })()}
        </div>
      </div>
      <div class="row" style="gap:6px;">
        <button class="btn btn-ghost btn-sm" data-toggle-exercise-collapse="${e.uid}">▲ Collapse</button>
        <button class="btn btn-ghost btn-sm" data-remove-ex="${e.uid}">✕</button>

    <div class="row wrap" style="gap:8px;margin-bottom:10px;">
      <button class="chip small" data-toggle-weighted="${e.uid}">${e.weighted?'Weighted ✓':'Bodyweight ✓'} — tap to swap</button>
      ${e.weighted ? `
        <button class="chip small ${exerciseWeightUnit(e)==='kg'?'active':''}" data-exercise-weight-unit="${e.uid}" data-weight-unit="kg">kg</button>
        <button class="chip small ${exerciseWeightUnit(e)==='lb'?'active':''}" data-exercise-weight-unit="${e.uid}" data-weight-unit="lb">lb</button>
      ` : ''}
      <button class="chip small" data-focus="${e.uid}">▣ Focus Mode</button>
      <button class="chip small" data-make-superset="${blockId}">Make it a Superset</button>
    </div>
    <div class="row wrap" style="gap:6px;margin-bottom:6px;align-items:center;">
      <span class="tiny muted" style="text-transform:uppercase;letter-spacing:0.6px;">Rest ⏱</span>

    <table class="setgrid">

        <th></th>

      <tbody>
        ${e.sets.map((st,idx)=>{
          const isPR = e.weighted && st.filled && isNewPRAtSet(e.exerciseId, e.sets, idx);
          return `<tr>
            <td class="set-num">${idx+1}</td>
            ${e.weighted?`<td><input type="text" inputmode="numeric" placeholder="0" value="${toDisplayWeightForUnit(st.weight, exerciseWeightUnit(e))}" data-decimal-field data-set-field="weight" data-exuid="${e.uid}" data-idx="${idx}"></td>`:`<td style="text-align:center;font-size:15px;padding:9px 6px;">BW</td>`}

    </div>
  </div>`;
}

function exercisePickerModal(){
  const search = (state._pickerSearch||'').trim().toLowerCase();
  const list = search
    ? sortByName(allExercises().filter(e=>e.name.toLowerCase().includes(search)))
    : sortByName(state._pickerMuscle?allExercises().filter(e=>e.muscle===state._pickerMuscle):allExercises());
  return `<div class="modal-backdrop" id="picker-backdrop">
    <div class="modal">
      <div class="modal-handle"></div>
      ${state._multiSelectExercises.length ? `
        <div style="position:sticky;top:0;z-index:5;background:var(--surface);padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid var(--border);">
          <button class="btn btn-accent btn-block" id="add-multiselect-btn">Add ${state._multiSelectExercises.length} Selected Exercise${state._multiSelectExercises.length!==1?'s':''}</button>
        </div>
      ` : ''}
      <p class="card-title">Add exercises</p>
      ${state._editingSessionTargetId ? (()=>{
        const targetSession = state.sessions.find(x=>x.id===state._editingSessionTargetId);
        return targetSession ? `<p class="small" style="color:var(--accent);margin-top:0;">Adding to your ${fmtDate(targetSession.date)} workout</p>` : '';
      })() : ''}
      ${state._activeSupersetBlock?`<p class="small" style="color:var(--accent);margin-top:0;">Adding to that superset</p>`:''}
      <p class="small muted" style="margin-top:0;">Select as many as you want, then add them all at once.</p>
      <input type="text" id="picker-search" placeholder="Search exercises…" value="${state._pickerSearch||''}" style="margin-bottom:10px;">
      <div class="row wrap" style="margin-bottom:10px;">
        ${MUSCLE_GROUPS.map(m=>`<button class="chip small ${state._pickerMuscle===m && !search?'active':''}" data-picker-muscle="${m}">${m}</button>`).join('')}
      </div>
      <button class="btn btn-ghost btn-block btn-sm" data-add-custom-for="${state._pickerMuscle||''}" style="margin-bottom:10px;">Don't see it? + Add your own exercise</button>
      ${list.length ? list.map(ex=>{
        const excluded = isExcluded(ex);
        const selected = state._multiSelectExercises.includes(ex.id);
        return `<div class="ex-item ${excluded?'excluded':''}" >
          <div style="flex:1;"><div class="ex-name">${ex.name}</div><div class="ex-meta">${ex.muscle}${excluded?` · Excluded because of your ${exclusionReason(ex).toLowerCase()} injury — adjust in Settings`:''}</div></div>
          ${excluded?`<button class="btn btn-ghost btn-sm" data-override="${ex.id}">Keep anyway</button>`:`<button class="btn ${selected?'btn-accent':'btn-ghost'} btn-sm" data-toggle-multiselect="${ex.id}">${selected?'✓ Selected':'+ Select'}</button>`}
        </div>`;
      }).join('') : `<p class="small muted" style="padding:10px 0;">No exercises match "${state._pickerSearch}".</p>`}
      <button class="btn btn-ghost btn-block" id="close-picker" style="margin-top:8px;">Close</button>
    </div>
  </div>`;
}

/* ---------- FOCUS MODE ---------- */
function focusOverlay(){
  const s=activeSession(); if(!s) { state.focusMode=false; return ''; }
  let exObj=null, ex=null;
  s.blocks.forEach(b=>b.exercises.forEach(e=>{ if(e.uid===state.focusTarget) exObj=e; }));
  if(exObj) ex = exerciseById(exObj.exerciseId);
  return `<div class="focus-overlay">
    <button class="btn btn-ghost btn-sm" id="exit-focus" style="position:absolute;top:20px;right:20px;">Exit</button>
    <div class="tiny muted" style="text-transform:uppercase;letter-spacing:2px;">Focus Mode</div>
    <div class="focus-exercise">${ex?ex.name:'Rest'}</div>
    <div class="ring" id="ring-fill" style="background:conic-gradient(var(--accent) ${state.timer.total?Math.max(0,state.timer.seconds/state.timer.total)*360:0}deg, var(--surface-2) 0deg);">
      <div style="width:186px;height:186px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;">
        <div class="focus-timer mono timer-live-text">${fmtSeconds(state.timer.seconds)}</div>
      </div>
    </div>
    <div class="row" style="gap:10px;margin-top:20px;">
      <button class="btn btn-ghost" data-focus-timer="60">1 min</button>
      <button class="btn btn-ghost" data-focus-timer="90">1.5 min</button>
      <button class="btn btn-ghost" data-focus-timer="120">2 min</button>
      <button class="btn btn-ghost" data-focus-timer="180">3 min</button>
    </div>
    <button class="btn btn-accent" id="focus-complete" style="margin-top:26px;padding:18px 40px;font-size:17px;">✓ Set Complete</button>
  </div>`;
}

/* ---------- HISTORY VIEW ---------- */
function getHistoryRangeStart(){
  const now = new Date();
  const filter = state._historyRangeFilter || 'all';
  if(filter==='today'){ const d=new Date(now); d.setHours(0,0,0,0); return d; }
  if(filter==='week'){ const d=new Date(now); d.setDate(now.getDate()-7); return d; }
  if(filter==='month'){ const d=new Date(now); d.setMonth(now.getMonth()-1); return d; }
  if(filter==='year'){ const d=new Date(now); d.setFullYear(now.getFullYear()-1); return d; }
  return null; // 'all'
}
function historyView(){
  const allSessions = pastSessions();
  if(!allSessions.length) return `<div class="empty"><div class="display">No workouts yet</div><div class="small">Finish a session and it'll show up here.</div></div>`;
  const rangeStart = getHistoryRangeStart();
  const sessions = rangeStart ? allSessions.filter(s=>new Date(s.date)>=rangeStart) : allSessions;
  const tab = state._historyTab || 'sessions';
  return `
    <div class="row wrap" style="gap:8px;margin-bottom:10px;">
      ${[['all','All Time'],['today','Today'],['week','This Week'],['month','This Month'],['year','This Year']].map(([id,label])=>
        `<button class="chip small ${(state._historyRangeFilter||'all')===id?'active':''}" data-history-range="${id}">${label}</button>`
      ).join('')}
    </div>
    <div class="row" style="gap:8px;margin-bottom:14px;">
      <button class="chip ${tab==='sessions'?'active':''}" data-history-tab="sessions">Sessions</button>
      <button class="chip ${tab==='prs'?'active':''}" data-history-tab="prs">PRs</button>
    </div>
    ${tab==='prs' ? prTableTab() : (sessions.length ? sessionsTab(sessions) : `<div class="empty"><div class="display">No workouts in this range</div><div class="small">Try a wider date range.</div></div>`)}
  `;
}

function sessionsTab(sessions){
  const categories = [
    {id:'run', label:'Run', list: sessions.filter(s=>s.type==='cardio' && s.discipline==='run')},
    {id:'bike', label:'Bike', list: sessions.filter(s=>s.type==='cardio' && s.discipline==='bike')},
    {id:'swim', label:'Swim', list: sessions.filter(s=>s.type==='cardio' && s.discipline==='swim')},
    {id:'hyrox', label:'Hyrox', list: sessions.filter(s=>s.type==='hyrox')},
    {id:'gym', label:'Gym', list: sessions.filter(s=>s.type!=='cardio' && s.type!=='hyrox')},
  ];
  return `
    <div class="card">
      <p class="card-title">Progressive overload</p>
      <select id="chart-exercise-select">
        <option value="">Select an exercise…</option>
        ${sortByName(allExercises()).map(e=>`<option value="${e.id}" ${state._chartEx===e.id?'selected':''}>${e.name}</option>`).join('')}
      </select>
      ${state._chartEx ? renderChart(state._chartEx) : ''}
    </div>
    ${categories.filter(c=>c.list.length).map(c=>`
    <div class="card">
      <p class="card-title">${c.label} — tap to view details</p>
      ${groupByWeek(c.list).map(wk=>{
        let summary;
        if(c.id==='gym') summary = `${wk.sessions.length} session${wk.sessions.length!==1?'s':''}`;
        else if(c.id==='hyrox') summary = `${wk.sessions.length} session${wk.sessions.length!==1?'s':''} · ${fmtDistance(wk.sessions.reduce((s,x)=>s+hyroxSessionTotalDistanceKm(x),0))} ${distUnitLabel()}`;
        else summary = `${wk.sessions.length} session${wk.sessions.length!==1?'s':''} · ${fmtDistance(wk.sessions.reduce((s,x)=>s+(Number(x.distance)||0),0))} ${distUnitLabel()}`;
        return `
        <div class="row between" style="margin:14px 0 6px 0;">
          <span class="tiny" style="text-transform:uppercase;letter-spacing:0.8px;color:var(--accent);font-weight:700;">${wk.label}</span>
          <span class="tiny muted">${summary}</span>
        </div>
        ${wk.sessions.map(s=>sessionRow(s)).join('')}
        `;
      }).join('')}
    </div>`).join('')}
    ${categories.every(c=>!c.list.length) ? `<div class="empty"><div class="display">No workouts yet</div><div class="small">Finish a session and it'll show up here.</div></div>` : ''}
  `;
}

function sessionRow(s){
  const expanded = state._expandedSession===s.id;
  const isCardio = s.type==='cardio';
  const isHyrox = s.type==='hyrox';
  const summary = isCardio
    ? s.cardioType
    : isHyrox
      ? `${(s.stations||[]).length} station${(s.stations||[]).length!==1?'s':''}`
      : [...new Set(s.blocks.flatMap(b=>b.exercises.map(e=>exerciseById(e.exerciseId).muscle)))].join(', ');
  const pace = isCardio && s.duration && s.distance ? fmtPace(s.duration/s.distance, s.discipline) : '';
  const rightLabel = isCardio
    ? `${fmtDistance(s.distance)} ${distUnitLabel()}${pace?` · ${pace}`:''}`
    : isHyrox
      ? `${fmtDistance(hyroxSessionTotalDistanceKm(s))} ${distUnitLabel()} · ${fmtDuration(hyroxSessionTotalTimeSec(s))}`
      : '';
  return `<div>
    <div class="row between" data-toggle-session="${s.id}" style="padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;">
      <div>
        <div style="font-weight:600;font-size:14px;">${fmtDate(s.date)}</div>
        <div class="tiny muted">${summary}</div>
      </div>
      <div class="row" style="gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:45%;">
        ${rightLabel?`<span class="tiny mono muted" style="text-align:right;">${rightLabel}</span>`:''}
        <span class="tiny muted">${expanded?'▲ Hide':'▼ Details'}</span>
      </div>
    </div>
    ${expanded ? (isCardio ? cardioSessionDetail(s) : isHyrox ? hyroxSessionDetail(s) : sessionDetail(s)) : ''}
  </div>`;
}

function hyroxSessionDetail(s){
  const editing = state._editingSession === s.id;
  const stationRow = (st, idx)=>{
    if(st.isRest){
      const restSec = stationTimeSec(st);
      if(!editing){
        return `<div class="row between small" style="padding:6px 0;border-bottom:1px solid var(--border);opacity:0.7;">
          <span>${idx+1}. 💤 Rest</span>
          <span class="mono tiny">${fmtDuration(restSec)}</span>
        </div>`;
      }
      return `<div class="card" style="margin-bottom:8px;background:var(--surface-2);">
        <div class="small muted" style="font-weight:600;margin-bottom:6px;">${idx+1}. 💤 Rest</div>
        <div class="row wrap" style="gap:8px;align-items:flex-end;">
          <div style="width:70px;"><label class="tiny muted">Time (m:ss)</label><input type="text" inputmode="numeric" placeholder="0:00" value="${formatMinSecText(st.timeM,st.timeS)}" data-hyrox-saved-minsec="${st.id}" data-saved-session-id="${s.id}"></div>
        </div>
      </div>`;
    }
    const timeSec = stationTimeSec(st);
    const isPR = isNewHyroxPRAtStation(s.stations, idx, s.date);
    const pace = hyroxRunPaceLabel(st);
    if(!editing){
      return `<div class="row between small" style="padding:6px 0;border-bottom:1px solid var(--border);">
        <span>${idx+1}. ${st.name}${isPR?' <span class="pr-badge">★ PR</span>':''}</span>
        <span class="mono tiny">${st.value}${st.unit==='reps'?' reps':' '+st.unit} · ${fmtDuration(timeSec)}${st.weight?` · ${st.weight}${unitLabel()}`:''}${pace?` · ${pace}`:''}</span>
      </div>`;
    }
    return `<div class="card" style="margin-bottom:8px;">
      <div class="small" style="font-weight:600;margin-bottom:6px;">${idx+1}. ${st.name}</div>
      <div class="row wrap" style="gap:8px;align-items:flex-end;">
        <div style="flex:1;min-width:70px;"><label class="tiny muted">${st.valueType==='distance'?'Distance ('+st.unit+')':'Reps'}</label><input type="number" value="${st.value}" data-hyrox-saved-field="value" data-saved-session-id="${s.id}" data-saved-station-id="${st.id}"></div>
        <div style="width:70px;"><label class="tiny muted">Time (m:ss)</label><input type="text" inputmode="numeric" placeholder="0:00" value="${formatMinSecText(st.timeM,st.timeS)}" data-hyrox-saved-minsec="${st.id}" data-saved-session-id="${s.id}"></div>
        ${HYROX_STATION_HAS_WEIGHT[st.name]?`<div style="width:80px;"><label class="tiny muted">Weight (${unitLabel()})</label><input type="text" inputmode="numeric" value="${st.weight}" data-decimal-field data-hyrox-saved-field="weight" data-saved-session-id="${s.id}" data-saved-station-id="${st.id}"></div>`:''}
      </div>
      ${pace?`<div class="tiny muted" style="margin-top:8px;">Pace: <span class="mono" style="color:var(--accent);">${pace}</span></div>`:''}
    </div>`;
  };
  return `<div style="padding:12px 0 16px 0;border-bottom:1px solid var(--border);">
    <div class="row between" style="margin-bottom:10px;">
      <span class="tiny muted"></span>
      <button class="btn ${editing?'btn-accent':'btn-ghost'} btn-sm" data-toggle-edit-session="${s.id}">${editing?'Done Editing':'Edit'}</button>
    </div>
    <div class="row wrap" style="gap:18px;margin-bottom:12px;">
      <div><div class="tiny muted">Total distance</div><div class="mono" style="font-size:16px;">${fmtDistance(hyroxSessionTotalDistanceKm(s))} ${distUnitLabel()}</div></div>
      <div><div class="tiny muted">Total time</div><div class="mono" style="font-size:16px;">${fmtDuration(hyroxSessionTotalTimeSec(s))}</div></div>
    </div>
    ${editing ? `<div style="margin-bottom:14px;">
      <label class="tiny muted">Overall finish time (overrides the per-station total, if set)</label>
      <div class="row wrap" style="gap:8px;margin-top:6px;">
        <div style="width:80px;"><label class="tiny muted">Min</label><input type="text" inputmode="numeric" placeholder="0" value="${s.manualTotalTimeM||''}" data-hyrox-manual-total-m="${s.id}"></div>
        <div style="width:80px;"><label class="tiny muted">Sec</label><input type="text" inputmode="numeric" placeholder="0" value="${s.manualTotalTimeS||''}" data-hyrox-manual-total-s="${s.id}"></div>
      </div>
    </div>` : ''}
    ${hyroxStationDistanceBreakdown(s.stations)}
    ${editing ? groupStationsForCompactDisplay(s.stations).map(g=>{
      if(g.type==='single') return stationRow(g.station, s.stations.indexOf(g.station));
      return compactCircuitCard(g, s.stations, {sessionId:s.id, date:s.date});
    }).join('') : groupHyroxStationsForDisplay(s.stations).map(g=>{
      if(g.type==='single') return stationRow(g.station, s.stations.indexOf(g.station));
      return `<div class="block-label" style="margin:10px 0 6px 0;">${circuitRoundHeaderLabel(g)}</div>
        ${g.stations.map(st=>stationRow(st, s.stations.indexOf(st))).join('')}`;
    }).join('')}
  </div>`;
}

function sessionDetail(s){
  const editing = state._editingSession === s.id;
  return `<div style="padding:12px 0 16px 0;border-bottom:1px solid var(--border);">
    <div class="row between" style="margin-bottom:10px;">
      <span class="tiny" style="color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:0.6px;">${editing?'Editing this workout':''}</span>
      <button class="btn ${editing?'btn-accent':'btn-ghost'} btn-sm" data-toggle-edit-session="${s.id}">${editing?'Done Editing':'Edit'}</button>
    </div>
    <div class="row wrap" style="gap:10px;margin-bottom:12px;align-items:flex-end;">
      <div style="flex:1;min-width:140px;">
        <label class="tiny muted">Duration (minutes) — for calorie-burn estimates</label>
        <input type="number" inputmode="numeric" placeholder="e.g. 60" value="${s.durationMin||''}" data-gym-duration-edit="${s.id}">
      </div>
    </div>
    ${s.blocks.map(b=>`
      <div class="block-label" style="margin-bottom:6px;">${b.label}${b.exercises.length>1?' · Superset':''}</div>
      ${b.exercises.map(e=> editing ? pastExerciseEditView(e, s, b.id) : pastExerciseReadView(e, s)).join('')}
    `).join('')}
    ${editing ? `<button class="btn btn-ghost btn-block btn-sm" data-add-exercise-to-past="${s.id}" style="margin-top:6px;">+ Add Exercise</button>` : ''}
  </div>`;
}

function cardioSessionDetail(s){
  const editing = state._editingSession === s.id;
  const gear = state.gear.find(g=>g.id===s.gearId);
  const pace = s.duration && s.distance ? fmtPace(s.duration/s.distance, s.discipline) : '—';
  if(editing) return cardioSessionEditView(s);
  return `<div style="padding:12px 0 16px 0;border-bottom:1px solid var(--border);">
    <div class="row between" style="margin-bottom:10px;">
      <span class="tiny muted"></span>
      <button class="btn btn-ghost btn-sm" data-toggle-edit-session="${s.id}">Edit</button>
    </div>
    <div class="row wrap" style="gap:18px;margin-bottom:10px;">
      <div><div class="tiny muted">Distance</div><div class="mono" style="font-size:16px;">${fmtDistance(s.distance)} ${distUnitLabel()}</div></div>
      <div><div class="tiny muted">Duration</div><div class="mono" style="font-size:16px;">${fmtDuration(s.duration)}</div></div>
      <div><div class="tiny muted">Pace</div><div class="mono" style="font-size:16px;">${pace}</div></div>
      ${s.avgHR?`<div><div class="tiny muted">Avg HR</div><div class="mono" style="font-size:16px;">${s.avgHR}</div></div>`:''}
      ${s.cadence?`<div><div class="tiny muted">${CADENCE_LABELS[s.discipline]}</div><div class="mono" style="font-size:16px;">${s.cadence}</div></div>`:''}
      ${s.discipline==='bike' && s.power?`<div><div class="tiny muted">Avg Power</div><div class="mono" style="font-size:16px;">${s.power}w</div></div>`:''}
      ${s.discipline==='swim' && s.swolf?`<div><div class="tiny muted">SWOLF</div><div class="mono" style="font-size:16px;">${s.swolf}</div></div>`:''}
    </div>
    ${s.mode==='structured' ? `
      <div class="tiny muted" style="margin-bottom:4px;">Structure</div>
      <div class="small" style="margin-bottom:10px;">
        Warmup: ${fmtDistance(s.warmupDistance)} ${distUnitLabel()}<br>
        ${s.intervals.map(iv=>`${iv.reps} × ${fmtDistance(iv.distance)} ${distUnitLabel()}, rest ${fmtDuration(iv.rest)}`).join('<br>')}<br>
        Cooldown: ${fmtDistance(s.cooldownDistance)} ${distUnitLabel()}
      </div>` : ''}
    ${gear?`<div class="small muted" style="margin-bottom:6px;">Gear: ${gear.name}</div>`:''}
    ${(s.nutrition&&s.nutrition.count)?`<div class="small muted" style="margin-bottom:6px;">Nutrition: ${s.nutrition.count} item(s), ${s.nutrition.calories||0} cal / ${s.nutrition.carbs||0}g carbs each</div>`:''}
    ${s.notes?`<div class="tiny muted">Notes: ${s.notes}</div>`:''}
  </div>`;
}

function cardioSessionEditView(s){
  const gearOptions = gearByDiscipline(s.discipline);
  const h = Math.floor((s.duration||0)/3600), m=Math.floor(((s.duration||0)%3600)/60), sec=(s.duration||0)%60;
  return `<div style="padding:12px 0 16px 0;border-bottom:1px solid var(--border);">
    <div class="row between" style="margin-bottom:10px;">
      <span class="tiny" style="color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:0.6px;">Editing this workout</span>
      <button class="btn btn-accent btn-sm" data-toggle-edit-session="${s.id}">Done Editing</button>
    </div>
    <div class="row wrap" style="gap:10px;margin-bottom:10px;">
      <div style="flex:1;"><label class="tiny muted">Distance (${distUnitLabel()})</label><input type="text" inputmode="numeric" data-decimal-field value="${toDisplayDistance(s.distance)}" data-cardio-edit="distance" data-session-id="${s.id}"></div>
    </div>
    <div class="row wrap" style="gap:8px;margin-bottom:10px;">
      <div style="flex:1;"><label class="tiny muted">Hours</label><input type="number" inputmode="numeric" value="${h||''}" data-cardio-edit="durationH" data-session-id="${s.id}"></div>
      <div style="flex:1;"><label class="tiny muted">Min</label><input type="number" inputmode="numeric" value="${m||''}" data-cardio-edit="durationM" data-session-id="${s.id}"></div>
      <div style="flex:1;"><label class="tiny muted">Sec</label><input type="number" inputmode="numeric" value="${sec||''}" data-cardio-edit="durationS" data-session-id="${s.id}"></div>
    </div>
    <div class="row wrap" style="gap:10px;margin-bottom:10px;">
      <div style="flex:1;"><label class="tiny muted">Avg HR</label><input type="number" inputmode="numeric" value="${s.avgHR||''}" data-cardio-edit="avgHR" data-session-id="${s.id}"></div>
      <div style="flex:1;"><label class="tiny muted">${CADENCE_LABELS[s.discipline]}</label><input type="number" inputmode="numeric" value="${s.cadence||''}" data-cardio-edit="cadence" data-session-id="${s.id}"></div>
      ${s.discipline==='bike'?`<div style="flex:1;"><label class="tiny muted">Avg Power (watts)</label><input type="number" inputmode="numeric" value="${s.power||''}" data-cardio-edit="power" data-session-id="${s.id}"></div>`:''}
      ${s.discipline==='swim'?`<div style="flex:1;"><label class="tiny muted">SWOLF</label><input type="number" inputmode="numeric" value="${s.swolf||''}" data-cardio-edit="swolf" data-session-id="${s.id}"></div>`:''}
    </div>
    <label class="tiny muted">Gear</label>
    <select data-cardio-edit="gearId" data-session-id="${s.id}" style="margin-bottom:10px;">
      <option value="">None</option>
      ${gearOptions.map(g=>`<option value="${g.id}" ${s.gearId===g.id?'selected':''}>${g.name}</option>`).join('')}
    </select>
    <label class="tiny muted">Notes</label>
    <textarea data-cardio-edit="notes" data-session-id="${s.id}" rows="2" style="width:100%;resize:vertical;">${s.notes||''}</textarea>
  </div>`;
}

function pastExerciseReadView(e, s){
  const ex=exerciseById(e.exerciseId);
  const validSets = e.sets.filter(st=>st.weight!=='' && st.reps!=='' || (!e.weighted && st.reps!==''));
  return `<div style="margin:0 0 14px 10px;">
    <div class="row" style="gap:6px;margin-bottom:4px;">
      <span style="font-weight:600;font-size:15px;">${ex.name}</span>
      <span class="tiny muted">${e.weighted?'· Weighted':'· Bodyweight'}</span>
    </div>
    <table class="setgrid" style="margin-top:2px;">
      <thead><tr>
        <th></th>
        <th>Weight (${exerciseWeightUnit(e)})</th>
        <th>Reps</th><th>RPE</th><th>Notes</th><th></th>
      </tr></thead>
      <tbody>
        ${validSets.map((st,idx)=>{
          const wasPR = e.weighted && isNewPRAtSet(e.exerciseId, validSets, idx, s.date);

function allTimePRs(){
  const map = {};
  pastGymSessions().forEach(s=>{
    s.blocks.forEach(b=>b.exercises.forEach(e=>{
      if(!e.weighted) return;
      e.sets.forEach(st=>{
        if(st.weight==='' || st.reps==='' || st.weight==null) return;
        const w = Number(st.weight);
        if(!map[e.exerciseId] || w > map[e.exerciseId].weight || (w===map[e.exerciseId].weight && Number(st.reps)>map[e.exerciseId].reps)){
          map[e.exerciseId] = {weight:w, reps:Number(st.reps), date:s.date};
        }
      });
    }));
  });
  return map;
}

function renderChart(exId){
  const hist = historyForExercise(exId);
  if(hist.length<2) return `<p class="small muted" style="margin-top:10px;">Need at least 2 logged sessions to chart this exercise.</p>`;
  const points = hist.map(h=>{
    const top = topSetWeightAndReps(h.sets);
    return {date:h.date, top: state.unit==='lb' ? kgToLb(top.weight) : top.weight, reps: top.reps};
  });
  const max = Math.max(...points.map(p=>p.top))*1.15 || 1;
  const min = Math.min(...points.map(p=>p.top))*0.85;
  const w=560, h=160, padTop=26, padBottom=22, padX=16;
  const stepX = (w-padX*2)/(points.length-1||1);
  const coords = points.map((p,i)=>{
    const x = padX + i*stepX;
    const y = h - padBottom - ((p.top-min)/((max-min)||1))*(h-padTop-padBottom);
    return {x,y,...p};
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  return `<div class="tiny muted" style="margin-top:8px;">Top set weight × reps, in ${unitLabel()}</div>
  <svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    ${coords.map(c=>`
      <circle cx="${c.x}" cy="${c.y}" r="4" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/>
      <text x="${c.x}" y="${c.y-10}" text-anchor="middle" font-size="12" fill="var(--text)" font-family="'JetBrains Mono', monospace" font-weight="700">${Math.round(c.top)}</text>
      <text x="${c.x}" y="${c.y+22}" text-anchor="middle" font-size="10" fill="var(--text-muted)" font-family="'JetBrains Mono', monospace">×${c.reps}</text>
    `).join('')}
  </svg>
  <div class="row between tiny muted"><span>${fmtDate(coords[0].date)}</span><span>${fmtDate(coords[coords.length-1].date)}</span></div>`;
}

const DASHBOARD_PALETTE = ['#22c55e','#4c7bff','#e8b93b','#e4453a','#a855f7','#22d3ee','#f97316','#84cc16'];

function getDashboardRange(){
  const now = new Date();
  let start, end = new Date(now);
  if(state._dashboardRange==='month'){ start = new Date(now); start.setMonth(now.getMonth()-1); }
  else if(state._dashboardRange==='3months'){ start = new Date(now); start.setMonth(now.getMonth()-3); }
  else if(state._dashboardRange==='year'){ start = new Date(now); start.setFullYear(now.getFullYear()-1); }
  else if(state._dashboardRange==='custom'){
    start = state._dashboardStart ? new Date(state._dashboardStart) : new Date(now.setMonth(now.getMonth()-1));
    end = state._dashboardEnd ? new Date(state._dashboardEnd) : new Date();
  } else { start = new Date(now); start.setDate(now.getDate()-7); } // week (default)
  start.setHours(0,0,0,0); end.setHours(23,59,59,999);
  return {start, end};
}
function sessionsInRange(sessions, start, end){
  return sessions.filter(s=>{ const d=new Date(s.date); return d>=start && d<=end; });
}
function renderDonut(segments, size){
  size = size||140;
  const total = segments.reduce((s,x)=>s+x.value,0);
  if(total<=0) return `<p class="small muted" style="margin:6px 0;">No data in this range.</p>`;
  const visible = segments.filter(s=>s.value>0);
  const r=60, cx=70, cy=70, strokeW=20, circumference=2*Math.PI*r;
  let cumulativeFrac = 0;
  const arcs = visible.map(seg=>{
    const frac = seg.value/total;
    const dash = frac*circumference;
    const offset = -cumulativeFrac*circumference;
    cumulativeFrac += frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${strokeW}" stroke-dasharray="${dash.toFixed(1)} ${(circumference-dash).toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  const totalDisplay = Math.round(total*10)/10;
  return `<div class="row wrap" style="gap:22px;align-items:center;margin-top:8px;">
    <div style="position:relative;width:140px;height:140px;flex-shrink:0;">
      <svg viewBox="0 0 140 140" width="140" height="140">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${strokeW}"/>
        ${arcs}
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div class="mono" style="font-size:21px;font-weight:700;line-height:1;">${totalDisplay}</div>
        <div class="tiny muted" style="text-transform:uppercase;letter-spacing:0.5px;">total</div>
      </div>
    </div>
    <div style="flex:1;min-width:160px;">
      ${visible.map(seg=>{
        const pct = Math.round(seg.value/total*100);
        return `<div class="row between" style="margin-bottom:12px;align-items:center;">
          <span class="small" style="font-weight:600;"><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${seg.color};margin-right:9px;vertical-align:middle;"></span>${seg.label}</span>
          <span style="text-align:right;">
            <div class="mono" style="font-size:20px;font-weight:700;line-height:1;color:${seg.color};">${pct}%</div>
            <div class="tiny muted" style="margin-top:2px;">${seg.value}</div>
          </span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function weeklyKmBuckets(sessions, weeksCount){
  weeksCount = weeksCount||8;
  const now = new Date();
  const buckets = [];
  for(let i=weeksCount-1; i>=0; i--){
    const end = new Date(now); end.setDate(now.getDate()-i*7); end.setHours(23,59,59,999);
    const start = new Date(end); start.setDate(end.getDate()-6); start.setHours(0,0,0,0);
    const km = sessions.filter(s=>{ const d=new Date(s.date); return d>=start && d<=end; }).reduce((sum,s)=>sum+(Number(s.distance)||0),0);
    buckets.push({start, end, km});
  }
  return buckets;
}
function weeklyTrendChart(sessions){
  const buckets = weeklyKmBuckets(sessions, 8);
  const max = Math.max(...buckets.map(b=>b.km), 0.001) * 1.15;
  const w=560, h=220, padTop=16, padBottom=34, padLeft=44, padRight=10;
  const plotW = w-padLeft-padRight, plotH = h-padTop-padBottom;
  const gridLines = [0, 0.25, 0.5, 0.75, 1];
  const barGap = 10;
  const barW = (plotW - barGap*(buckets.length-1)) / buckets.length;
  const yFor = (val)=> padTop + plotH - (val/max)*plotH;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:220px;">
    ${gridLines.map(g=>{
      const y = padTop + plotH*(1-g);
      const val = Math.round(max*g*10)/10;
      return `
        <line x1="${padLeft}" y1="${y}" x2="${w-padRight}" y2="${y}" stroke="var(--border)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        <text x="${padLeft-8}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--text-muted)" font-family="'JetBrains Mono', monospace" font-weight="600">${val}</text>
      `;
    }).join('')}
    ${buckets.map((b,i)=>{
      const x = padLeft + i*(barW+barGap);
      const yTop = yFor(b.km);
      const barH = Math.max(1, (padTop+plotH) - yTop);
      const isDown = i>0 && b.km < buckets[i-1].km;
      const color = isDown ? 'var(--red)' : 'var(--accent)';
      const labelX = x + barW/2;
      return `
        <text x="${labelX}" y="${yTop-10}" text-anchor="middle" font-size="13" font-weight="800" fill="${isDown?'var(--red)':'var(--text)'}" font-family="'JetBrains Mono', monospace">${Math.round(b.km*10)/10}</text>
        <rect x="${x}" y="${yTop}" width="${barW}" height="${barH}" rx="3" fill="${color}"/>
        <text x="${labelX}" y="${h-14}" text-anchor="middle" font-size="10.5" fill="var(--text-muted)" font-weight="600">${fmtDate(b.start).replace(' ','\u00A0')}</text>
      `;
    }).join('')}
  </svg>
  <p class="tiny muted" style="margin-top:6px;">Red bar = that week's total km was lower than the week before.</p>`;
}

// Total training TIME across every modality — a different question than "how much did I
// run": Hyrox keeps its own slice here (including any running inside it) so it isn't split
// across two buckets and double-represented.
function disciplineMixSegments(gymList, cardioList, hyroxList){
  const gymSec = gymList.reduce((s,x)=>s+(Number(x.durationMin)||0)*60,0);
  const runSec = cardioList.filter(s=>s.discipline==='run').reduce((s,x)=>s+(Number(x.duration)||0),0);
  const bikeSec = cardioList.filter(s=>s.discipline==='bike').reduce((s,x)=>s+(Number(x.duration)||0),0);
  const swimSec = cardioList.filter(s=>s.discipline==='swim').reduce((s,x)=>s+(Number(x.duration)||0),0);
  const hyroxSec = hyroxList.reduce((s,x)=>s+hyroxSessionTotalTimeSec(x),0);
  return [
    {label:'Gym', value:Math.round(gymSec/60), color:DASHBOARD_PALETTE[0]},
    {label:'Run', value:Math.round(runSec/60), color:DASHBOARD_PALETTE[1]},
    {label:'Bike', value:Math.round(bikeSec/60), color:DASHBOARD_PALETTE[2]},
    {label:'Swim', value:Math.round(swimSec/60), color:DASHBOARD_PALETTE[3]},
    {label:'Hyrox', value:Math.round(hyroxSec/60), color:DASHBOARD_PALETTE[4]},
  ].filter(s=>s.value>0);
}
// Independent of the dashboard's date-range picker on purpose — this is a "how's my current
// consistency" pulse check, not a historical range query.
function daysWithAnySession(daysBack){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-(daysBack-1)); cutoff.setHours(0,0,0,0);
  const daySet = new Set();
  state.sessions.filter(s=>!s.active).forEach(s=>{ if(new Date(s.date)>=cutoff) daySet.add(dateKey(s.date)); });
  return daySet.size;
}
function daysSinceLastRestDay(){
  const trainedDays = new Set(state.sessions.filter(s=>!s.active).map(s=>dateKey(s.date)));
  const d = new Date(); d.setHours(0,0,0,0);
  for(let i=1;i<=90;i++){
    d.setDate(d.getDate()-1); // steps back one more day each pass — starts at yesterday
    if(!trainedDays.has(dateKey(d))) return i;
  }
  return null; // no rest day found in the last 90 days
}
// Every new PR — gym sets and Hyrox stations alike — hit within the selected range, newest first.
function recentPRsInRange(gymList, hyroxList){
  const out = [];
  gymList.forEach(s=>{
    (s.blocks||[]).forEach(b=>(b.exercises||[]).forEach(e=>{
      if(!e.weighted) return;
      const validSets = e.sets.filter(st=>st.weight!=='' && st.reps!=='' && st.weight!=null);
      validSets.forEach((st,idx)=>{
        if(isNewPRAtSet(e.exerciseId, validSets, idx, s.date)){
          const ex = exerciseById(e.exerciseId);
          out.push({date:s.date, label:ex?ex.name:'Exercise', detail:`${toDisplayWeight(st.weight)}${unitLabel()} × ${st.reps}`});
        }
      });
    }));
  });
  hyroxList.forEach(s=>{
    (s.stations||[]).forEach((st,idx)=>{
      if(st.isRest) return;
      if(isNewHyroxPRAtStation(s.stations, idx, s.date)){
        out.push({date:s.date, label:st.name, detail:`${st.value}${st.unit==='reps'?' reps':' '+st.unit} in ${fmtDuration(stationTimeSec(st))}`});
      }
    });
  });
  return out.sort((a,b)=>new Date(b.date)-new Date(a.date));
}
// Uses your CURRENT maintenance estimate as a stable reference point applied across the range —
// not a historically precise target for each past day, same honest simplification as Nutrition History.
function avgDailyCalorieBalance(start, end){
  const days = nutritionDaysWithLogs().filter(d=>{ const dt=new Date(d.date); return dt>=start && dt<=end; });
  if(!days.length) return null;
  const maintenance = calcTDEE();
  if(!maintenance) return null;
  const avgEaten = days.reduce((s,d)=>s+dayTotals(d.logs).cal,0)/days.length;
  return {avgEaten:Math.round(avgEaten), maintenance, netAvg:Math.round(avgEaten-maintenance), daysCounted:days.length};
}
function hyroxFullRaceSessions(hyroxList){
  return hyroxList.filter(s=>(Number(s.manualTotalTimeM)||0)>0 || (Number(s.manualTotalTimeS)||0)>0)
    .sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function hyroxStationLeaderboard(){
  const best = {};
  pastHyroxSessions().forEach(s=>{
    (s.stations||[]).forEach(st=>{
      if(st.isRest || st.value==='' || st.value==null) return;
      const t = stationTimeSec(st); if(t<=0) return;
      const key = st.name+'|'+st.value+'|'+st.unit;
      if(!best[key] || t<best[key].timeSec) best[key] = {name:st.name, value:st.value, unit:st.unit, timeSec:t, date:s.date};
    });
  });
  return Object.values(best).sort((a,b)=>a.name.localeCompare(b.name));
}

    <div class="card">
      <p class="card-title">Food search (branded &amp; USDA database)</p>
      <p class="small muted" style="margin-top:0;">Live search runs through a shared server-side function now, with results cached across every user — once someone searches a food, everyone after them gets it instantly with no repeat lookups. Nothing to set up here on your end.</p>
    </div>

    <div class="card">
      <p class="card-title">Appearance</p>
      <p class="small muted" style="margin-top:0;">Dark reads better in low light; light reads better outdoors and in direct sun — pick whichever fits how you actually use the app.</p>

        <button class="chip ${state.theme!=='light'?'active':''}" data-theme="dark">Dark</button>

      <div class="row wrap">
        <button class="chip ${state.unit==='kg'?'active':''}" data-unit="kg">Kilograms (kg)</button>
        <button class="chip ${state.unit==='lb'?'active':''}" data-unit="lb">Pounds (lb)</button>
      </div>
    </div>

    <div class="card">
      <p class="card-title">Height unit</p>
      <p class="small muted" style="margin-top:0;">Applies to your height in Nutrition Setup.</p>
      <div class="row wrap">
        <button class="chip ${state.heightUnit==='cm'?'active':''}" data-height-unit="cm">Centimeters (cm)</button>
        <button class="chip ${state.heightUnit==='in'?'active':''}" data-height-unit="in">Inches (in)</button>
      </div>
    </div>

    <div class="card">
      <p class="card-title">Distance unit</p>
      <p class="small muted" style="margin-top:0;">Applies to Run/Bike/Swim logging, gear wear, and the dashboard charts.</p>
      <div class="row wrap">
        <button class="chip ${state.distanceUnit==='km'?'active':''}" data-distance-unit="km">Kilometers (km)</button>
        <button class="chip ${state.distanceUnit==='mi'?'active':''}" data-distance-unit="mi">Miles (mi)</button>
      </div>
    </div>

    <div class="card">
      <p class="card-title">Injury filter</p>
      <p class="small muted" style="margin-top:0;">Select any injuries. Matching exercises are hidden from the picker by default — you can still add them individually with "Keep anyway."</p>
      <div class="row wrap">
        ${INJURY_OPTIONS.map(i=>`<button class="chip ${state.injuries.includes(i.id)?'active':''}" data-injury="${i.id}">${i.label}</button>`).join('')}
      </div>
      <p class="tiny muted" style="margin:10px 0 0 0;padding-top:10px;border-top:1px solid var(--border);">This is a general guide, not medical advice. It doesn't account for severity, stage of recovery, or your individual case. Check with a physical therapist or doctor for anything beyond minor discomfort.</p>
    </div>

    <div class="card">
      <p class="card-title">Add to your home screen</p>
      <p class="small muted" style="margin-top:0;">This turns Hybrid Athlete into an app icon that opens full-screen, with no browser bar. It's not a live-data widget — phones only allow those for apps downloaded from the App Store or Play Store, not web apps — but it opens and feels just like a regular app.</p>
      <div style="margin-top:10px;">
        <div class="tiny" style="text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:700;margin-bottom:4px;">On iPhone (Safari)</div>
        <div class="small muted">Tap the Share icon <span class="mono">⬆</span> → "Add to Home Screen" → Add.</div>
      </div>
      <div style="margin-top:12px;">
        <div class="tiny" style="text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:700;margin-bottom:4px;">On Android (Chrome)</div>
        <div class="small muted">Tap the ⋮ menu → "Add to Home screen" or "Install app" → Add.</div>
      </div>
    </div>

    <div class="card">
      <p class="card-title">Your data</p>
      <p class="small muted" style="margin-top:0;">Export everything you've logged, or permanently delete it.</p>
      <div class="row" style="gap:10px;margin-bottom:10px;">
        <button class="btn btn-accent" style="flex:1;" id="export-gym-btn">Download Gym CSV</button>
        <button class="btn btn-accent" style="flex:1;" id="export-cardio-btn">Download Cardio CSV</button>
      </div>
      <button class="btn btn-ghost btn-block" id="export-data-btn" style="margin-bottom:10px;">Download Everything (JSON)</button>
      ${state._confirmDeleteData ? `
        <div style="padding:10px;border:1px solid var(--red);border-radius:10px;margin-bottom:10px;">
          <p class="small" style="margin:0 0 10px 0;color:var(--red);"><strong>This permanently deletes all your logged data</strong> — sessions, food logs, weigh-ins, everything. Your login stays active, just empty. This can't be undone.</p>
          <div class="row" style="gap:8px;">
            <button class="btn btn-ghost" style="flex:1;" id="cancel-delete-data-btn">Cancel</button>
            <button class="btn" style="flex:1;background:var(--red);color:#fff;" id="confirm-delete-data-btn">Yes, delete my data</button>
          </div>
        </div>
      ` : `<button class="btn btn-ghost btn-block" id="delete-data-btn" style="color:var(--red);border-color:var(--red);margin-bottom:10px;">Delete My Data</button>`}
      ${state._confirmDeleteAccount ? `
        <div style="padding:10px;border:1px solid var(--red);border-radius:10px;">
          <p class="small" style="margin:0 0 10px 0;color:var(--red);"><strong>This permanently deletes your entire account</strong> — your data AND your login. You won't be able to log back in with this email unless you sign up again from scratch. This can't be undone.</p>
          <div class="row" style="gap:8px;">
            <button class="btn btn-ghost" style="flex:1;" id="cancel-delete-account-btn">Cancel</button>
            <button class="btn" style="flex:1;background:var(--red);color:#fff;" id="confirm-delete-account-btn" ${state._deletingAccount?'disabled':''}>${state._deletingAccount?'Deleting…':'Yes, delete my account'}</button>
          </div>
        </div>
      ` : `<button class="btn btn-ghost btn-block" id="delete-account-btn" style="color:var(--red);border-color:var(--red);">Delete My Account</button>`}
    </div>

    <div class="card">
      <p class="card-title">About this build</p>
      <p class="small muted" style="margin:0 0 10px 0;">Hybrid Athlete — training, nutrition, and recovery tracking for hybrid athletes (gym, run, bike, swim, Hyrox). Real accounts and cross-device sync via Supabase, hosted for real. Still growing — expect rough edges, and tell us when something breaks.</p>
      <p class="tiny muted" style="margin:0;">This app provides fitness and nutrition estimates for informational purposes only and is not a substitute for professional medical, nutritional, or coaching advice. Consult a qualified professional before making significant changes to your training or diet.</p>
    </div>
  `;
}

/* ============================= EVENT HANDLING ============================= */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{ state.view=el.dataset.nav; state._showPicker=false; render(); });

  const retrySaveBtn = document.getElementById('retry-save-btn');
  if(retrySaveBtn) retrySaveBtn.onclick=()=>attemptSave(2);

  document.querySelectorAll('[data-log-readiness]').forEach(el=>el.onclick=()=>logReadiness(Number(el.dataset.logReadiness)));
  const otherSportSelect = document.getElementById('other-sport-select');
  if(otherSportSelect) otherSportSelect.onchange=()=>{ state._otherSportPick = otherSportSelect.value; render(); };
  const otherSportDurationInput = document.getElementById('other-sport-duration');
  if(otherSportDurationInput) otherSportDurationInput.oninput=()=>{ state._otherSportDuration = otherSportDurationInput.value; };
  const otherSportHRInput = document.getElementById('other-sport-hr');
  if(otherSportHRInput) otherSportHRInput.oninput=()=>{ state._otherSportHR = otherSportHRInput.value; };
  const otherSportStepsInput = document.getElementById('other-sport-steps');
  if(otherSportStepsInput) otherSportStepsInput.oninput=()=>{ state._otherSportSteps = otherSportStepsInput.value; };
  document.querySelectorAll('[data-steps-mode]').forEach(el=>el.onclick=()=>{ state._otherSportStepsMode=el.dataset.stepsMode; render(); });
  const saveOtherSportBtn = document.getElementById('save-other-sport-btn');
  if(saveOtherSportBtn) saveOtherSportBtn.onclick=saveOtherSportLog;
  document.querySelectorAll('[data-delete-other-sport]').forEach(el=>el.onclick=()=>deleteOtherSportLog(el.dataset.deleteOtherSport));
  document.querySelectorAll('[data-log-choice]').forEach(el=>el.onclick=()=>{
    state._logChoice = el.dataset.logChoice;
    if(state._logChoice==='hyrox') state._hyroxDraft = newHyroxDraft();
    else if(state._logChoice!=='gym') state._cardioDraft = newCardioDraft(state._logChoice);
    render();
  });
  document.querySelectorAll('#back-to-log-choice').forEach(el=>el.onclick=()=>{ state._logChoice=null; render(); });
  document.querySelectorAll('[data-cardio-type]').forEach(el=>el.onclick=()=>{
    if(!state._cardioDraft) state._cardioDraft = newCardioDraft(state._logChoice);
    state._cardioDraft.cardioType = el.dataset.cardioType;
    render();
  });
  document.querySelectorAll('[data-cardio-mode]').forEach(el=>el.onclick=()=>{
    if(state._cardioDraft) state._cardioDraft.mode = el.dataset.cardioMode;
    render();
  });
  const cancelCardioBtn = document.getElementById('cancel-cardio-draft');
  if(cancelCardioBtn) cancelCardioBtn.onclick=cancelCardioDraft;
  const cardioLogDateInput = document.getElementById('cardio-log-date');
  if(cardioLogDateInput) cardioLogDateInput.onchange=()=>{ state._cardioDraft.logDate = cardioLogDateInput.value; };
  document.querySelectorAll('[data-interval-unit]').forEach(el=>el.onclick=()=>{
    const d = state._cardioDraft; if(!d) return;
    const newUnit = el.dataset.intervalUnit;
    if(d.intervalUnit===newUnit) return;
    const convert = (valStr)=>{
      if(valStr==='' || valStr==null) return valStr;
      const km = fromIntervalDisplay(valStr, d.intervalUnit);
      return toIntervalDisplay(km, newUnit);
    };
    d.warmupDistance = convert(d.warmupDistance);
    d.cooldownDistance = convert(d.cooldownDistance);
    d.intervals.forEach(iv=>{ iv.distance = convert(iv.distance); });
    d.intervalUnit = newUnit;
    render();
  });
  const PACE_AFFECTING_FIELDS = new Set(['distance','durationH','durationM','durationS','warmupDistance','cooldownDistance']);
  document.querySelectorAll('[data-cardio-field]').forEach(el=>{
    el.oninput=()=>{
      if(!state._cardioDraft) return;
      state._cardioDraft[el.dataset.cardioField]=el.value;
      if(PACE_AFFECTING_FIELDS.has(el.dataset.cardioField)) recalcCardioPaceDisplay();
    };
    if(el.tagName==='SELECT') el.onchange=()=>{ if(state._cardioDraft) state._cardioDraft[el.dataset.cardioField]=el.value; render(); };
  });
  document.querySelectorAll('[data-interval-field]').forEach(el=>{
    el.oninput=()=>{
      if(!state._cardioDraft) return;
      state._cardioDraft.intervals[Number(el.dataset.idx)][el.dataset.intervalField] = el.value;
      recalcCardioPaceDisplay();
    };
  });
  document.querySelectorAll('[data-remove-interval]').forEach(el=>el.onclick=()=>removeIntervalRow(Number(el.dataset.removeInterval)));
  const addIntervalBtn = document.getElementById('add-interval-btn');
  if(addIntervalBtn) addIntervalBtn.onclick=addIntervalRow;
  const saveCardioBtn = document.getElementById('save-cardio-btn');
  if(saveCardioBtn) saveCardioBtn.onclick=saveCardioSession;

  const discardHyroxBtn = document.getElementById('discard-hyrox-btn');
  if(discardHyroxBtn) discardHyroxBtn.onclick=discardHyroxDraft;
  const hyroxLogDateInput = document.getElementById('hyrox-log-date');
  if(hyroxLogDateInput) hyroxLogDateInput.onchange=()=>{ state._hyroxDraft.logDate = hyroxLogDateInput.value; };
  const hyroxManualTimeM = document.getElementById('hyrox-manual-time-m');
  if(hyroxManualTimeM) hyroxManualTimeM.oninput=()=>{ state._hyroxDraft.manualTotalTimeM = hyroxManualTimeM.value; };
  const hyroxManualTimeS = document.getElementById('hyrox-manual-time-s');
  if(hyroxManualTimeS) hyroxManualTimeS.oninput=()=>{ state._hyroxDraft.manualTotalTimeS = hyroxManualTimeS.value; };
  const addHyroxStationBtn = document.getElementById('add-hyrox-station-btn');
  if(addHyroxStationBtn) addHyroxStationBtn.onclick=()=>{ state._showHyroxStationPicker=true; render(); };
  const closeHyroxPicker = document.getElementById('close-hyrox-picker');
  if(closeHyroxPicker) closeHyroxPicker.onclick=()=>{ state._showHyroxStationPicker=false; render(); };
  const hyroxPickerBackdrop = document.getElementById('hyrox-picker-backdrop');
  if(hyroxPickerBackdrop) hyroxPickerBackdrop.onclick=(e)=>{ if(e.target.id==='hyrox-picker-backdrop'){ state._showHyroxStationPicker=false; render(); } };
  document.querySelectorAll('[data-add-hyrox-station]').forEach(el=>el.onclick=()=>addHyroxStation(el.dataset.addHyroxStation));
  const newHyroxStationNameInput = document.getElementById('new-hyrox-station-name');
  if(newHyroxStationNameInput) newHyroxStationNameInput.oninput=()=>{ state._newHyroxStationName = newHyroxStationNameInput.value; };
  const saveCustomHyroxStationBtn = document.getElementById('save-custom-hyrox-station-btn');
  if(saveCustomHyroxStationBtn) saveCustomHyroxStationBtn.onclick=()=>{
    saveCustomHyroxStation(state._newHyroxStationName);
    state._newHyroxStationName='';
  };
  document.querySelectorAll('[data-remove-hyrox-station]').forEach(el=>el.onclick=()=>removeHyroxStation(el.dataset.removeHyroxStation));
  document.querySelectorAll('[data-hyrox-value-type]').forEach(el=>el.onclick=()=>{
    updateHyroxStationField(el.dataset.hyroxValueType, 'valueType', el.dataset.valueType);
    updateHyroxStationField(el.dataset.hyroxValueType, 'unit', el.dataset.valueType==='distance'?'m':'reps');
    updateHyroxStationField(el.dataset.hyroxValueType, 'value', '');
    render();
  });
  document.querySelectorAll('[data-compact-value-type]').forEach(el=>el.onclick=()=>{
    const ids = el.dataset.compactValueType.split(',');
    const valueType = el.dataset.valueType;
    const savedSessionId = el.dataset.savedSessionId;
    const targetStations = savedSessionId ? (state.sessions.find(x=>x.id===savedSessionId)||{}).stations : (state._hyroxDraft||{}).stations;
    if(!targetStations) return;
    ids.forEach(id=>{
      const st = targetStations.find(s=>s.id===id); if(!st) return;
      st.valueType = valueType;
      st.unit = valueType==='distance' ? 'm' : 'reps';
      st.value = '';
    });
    if(savedSessionId) saveData();
    render();
  });
  document.querySelectorAll('[data-hyrox-minsec]').forEach(el=>{
    el.oninput=()=>{
      const parsed = parseMinSecText(el.value);
      updateHyroxStationField(el.dataset.hyroxMinsec, 'timeM', parsed.m);
      updateHyroxStationField(el.dataset.hyroxMinsec, 'timeS', parsed.s);
    };
  });
  document.querySelectorAll('[data-hyrox-saved-minsec]').forEach(el=>{
    el.oninput=()=>{
      const s = state.sessions.find(x=>x.id===el.dataset.savedSessionId); if(!s) return;
      const st = s.stations.find(x=>x.id===el.dataset.hyroxSavedMinsec); if(!st) return;
      const parsed = parseMinSecText(el.value);
      st.timeM = parsed.m; st.timeS = parsed.s;
      saveData();
    };
  });
  document.querySelectorAll('[data-hyrox-field]').forEach(el=>{
    const fire=()=>updateHyroxStationField(el.dataset.stationId, el.dataset.hyroxField, el.value);
    el.oninput=fire;
    if(el.tagName==='SELECT') el.onchange=()=>{ fire(); render(); };
  });
  const saveHyroxBtn = document.getElementById('save-hyrox-btn');
  if(saveHyroxBtn) saveHyroxBtn.onclick=saveHyroxSession;
  document.querySelectorAll('[data-hyrox-saved-field]').forEach(el=>{
    el.oninput=()=>{
      const s = state.sessions.find(x=>x.id===el.dataset.savedSessionId); if(!s) return;
      const st = s.stations.find(x=>x.id===el.dataset.savedStationId); if(!st) return;
      st[el.dataset.hyroxSavedField] = el.value;
      saveData();
    };
  });
  document.querySelectorAll('[data-hyrox-manual-total-m]').forEach(el=>{
    el.oninput=()=>{
      const s = state.sessions.find(x=>x.id===el.dataset.hyroxManualTotalM); if(!s) return;
      s.manualTotalTimeM = el.value; saveData();
    };
  });
  document.querySelectorAll('[data-hyrox-manual-total-s]').forEach(el=>{
    el.oninput=()=>{
      const s = state.sessions.find(x=>x.id===el.dataset.hyroxManualTotalS); if(!s) return;
      s.manualTotalTimeS = el.value; saveData();
    };
  });

  const addHyroxRoundBtn = document.getElementById('add-hyrox-round-btn');
  if(addHyroxRoundBtn) addHyroxRoundBtn.onclick=openRoundBuilder;
  const addHyroxRestBtn = document.getElementById('add-hyrox-rest-btn');
  if(addHyroxRestBtn) addHyroxRestBtn.onclick=addHyroxRest;
  const closeRoundBuilderBtn = document.getElementById('close-round-builder');
  if(closeRoundBuilderBtn) closeRoundBuilderBtn.onclick=()=>{ state._showRoundBuilder=false; render(); };
  const roundBuilderBackdrop = document.getElementById('round-builder-backdrop');
  if(roundBuilderBackdrop) roundBuilderBackdrop.onclick=(e)=>{ if(e.target.id==='round-builder-backdrop'){ state._showRoundBuilder=false; render(); } };
  document.querySelectorAll('[data-add-round-template]').forEach(el=>el.onclick=()=>addRoundTemplateStation(el.dataset.addRoundTemplate));
  document.querySelectorAll('[data-add-round-template-rest]').forEach(el=>el.onclick=addRoundTemplateRest);
  document.querySelectorAll('[data-remove-round-template]').forEach(el=>el.onclick=()=>removeRoundTemplateStation(el.dataset.removeRoundTemplate));
  document.querySelectorAll('[data-round-template-value-type]').forEach(el=>el.onclick=()=>{
    const id = el.dataset.roundTemplateValueType;
    updateRoundTemplateField(id, 'valueType', el.dataset.valueType);
    updateRoundTemplateField(id, 'unit', el.dataset.valueType==='distance'?'m':'reps');
    updateRoundTemplateField(id, 'value', '');
    render();
  });
  document.querySelectorAll('[data-round-template-field]').forEach(el=>{
    const fire=()=>updateRoundTemplateField(el.dataset.templateId, el.dataset.roundTemplateField, el.value);
    el.oninput=fire;
    if(el.tagName==='SELECT') el.onchange=()=>{ fire(); render(); };
  });
  document.querySelectorAll('[data-round-circuit-type]').forEach(el=>el.onclick=()=>{ state._roundCircuitType=el.dataset.roundCircuitType; render(); });
  const emomIntervalM = document.getElementById('emom-interval-m');
  if(emomIntervalM) emomIntervalM.oninput=()=>{ state._roundEmomIntervalM = emomIntervalM.value; };
  const emomIntervalS = document.getElementById('emom-interval-s');
  if(emomIntervalS) emomIntervalS.oninput=()=>{ state._roundEmomIntervalS = emomIntervalS.value; };
  const amrapCapM = document.getElementById('amrap-cap-m');
  if(amrapCapM) amrapCapM.oninput=()=>{ state._roundAmrapCapM = amrapCapM.value; };
  const amrapCapS = document.getElementById('amrap-cap-s');
  if(amrapCapS) amrapCapS.oninput=()=>{ state._roundAmrapCapS = amrapCapS.value; };
  document.querySelectorAll('[data-round-repeat]').forEach(el=>el.onclick=()=>{ state._roundRepeatCount=Number(el.dataset.roundRepeat); render(); });
  const roundRepeatCustom = document.getElementById('round-repeat-custom');
  if(roundRepeatCustom) roundRepeatCustom.oninput=()=>{ state._roundRepeatCount = roundRepeatCustom.value; };
  const confirmRoundBtn = document.getElementById('confirm-round-btn');
  if(confirmRoundBtn) confirmRoundBtn.onclick=confirmAddRound;

  document.querySelectorAll('[data-cardio-edit]').forEach(el=>{
    const fire=()=>updateCardioField(el.dataset.sessionId, el.dataset.cardioEdit, el.value);
    el.oninput=fire;
    if(el.tagName==='SELECT') el.onchange=()=>{
      fire();
      if(el.dataset.cardioEdit==='gearId'){
        const wearWarning = checkGearWear80([el.value]);
        if(wearWarning) showToast(`⚠ ${wearWarning.name} at ${wearWarning.pct}% wear`);
      }
      render();
    };
  });

  const muscleBtn = document.querySelectorAll('[data-muscle]');
  muscleBtn.forEach(el=>el.onclick=()=>{
    const m=el.dataset.muscle;
    state.builderMuscles = state.builderMuscles.includes(m) ? state.builderMuscles.filter(x=>x!==m) : [...state.builderMuscles, m];
    render();
  });

  document.querySelectorAll('[data-toggle-multiselect]').forEach(el=>el.onclick=()=>toggleMultiSelectExercise(el.dataset.toggleMultiselect));
  const addMultiselectBtn = document.getElementById('add-multiselect-btn');
  if(addMultiselectBtn) addMultiselectBtn.onclick=confirmMultiSelectAdd;
  document.querySelectorAll('[data-override]').forEach(el=>el.onclick=()=>{
    state.overrides.push(el.dataset.override); saveData(); render();
  });

  const startBtn = document.getElementById('start-session-btn');
  if(startBtn) startBtn.onclick=()=>{
    if(state._multiSelectExercises.length) confirmMultiSelectAdd();
    else if(!activeSession()) startNewSession();
  };

  const loadMuscleRepeatBtn = document.getElementById('load-muscle-repeat-btn');
  if(loadMuscleRepeatBtn) loadMuscleRepeatBtn.onclick=loadMuscleRepeat;

  const addExBtn = document.getElementById('add-exercise-btn');
  if(addExBtn) addExBtn.onclick=()=>{ state._editingSessionTargetId=null; state._showPicker=true; state._pickerMuscle=null; state._pickerSearch=''; state._multiSelectExercises=[]; render(); };
  const activeSessionDateInput = document.getElementById('active-session-date');
  if(activeSessionDateInput) activeSessionDateInput.onchange=()=>{
    const s = activeSession(); if(!s) return;
    s.date = dateInputToISO(activeSessionDateInput.value);
    saveData(); render();
  };
  const finishSupersetBtn = document.getElementById('finish-superset-btn');
  if(finishSupersetBtn) finishSupersetBtn.onclick=finishSuperset;
  document.querySelectorAll('[data-make-superset]').forEach(el=>el.onclick=()=>{
    state._editingSessionTargetId=null;
    markBlockAsSuperset(el.dataset.makeSuperset);
    state._showPicker=true; state._pickerMuscle=null; state._pickerSearch=''; state._multiSelectExercises=[]; render();
  });
  document.querySelectorAll('[data-add-exercise-to-past]').forEach(el=>el.onclick=()=>{
    state._editingSessionTargetId = el.dataset.addExerciseToPast;
    state._activeSupersetBlock = null;
    state._showPicker=true; state._pickerMuscle=null; state._pickerSearch=''; state._multiSelectExercises=[]; render();
  });
  document.querySelectorAll('[data-make-superset-past]').forEach(el=>el.onclick=()=>{
    state._editingSessionTargetId = el.dataset.supersetSessionId;
    markBlockAsSuperset(el.dataset.makeSupersetPast);
    state._showPicker=true; state._pickerMuscle=null; state._pickerSearch=''; state._multiSelectExercises=[]; render();
  });

  document.querySelectorAll('[data-picker-muscle]').forEach(el=>el.onclick=()=>{ state._pickerMuscle = state._pickerMuscle===el.dataset.pickerMuscle?null:el.dataset.pickerMuscle; render(); });
  const closePicker = document.getElementById('close-picker');
  if(closePicker) closePicker.onclick=()=>{ state._showPicker=false; state._multiSelectExercises=[]; state._editingSessionTargetId=null; render(); };
  const backdrop = document.getElementById('picker-backdrop');

    const mode = state._addFoodMode || 'per100';
    let cal, protein, carbs, fat;
    if(mode==='whole'){
      const size = Number(document.getElementById('new-food-package-size').value)||0;
      if(size<=0){ showToast('Enter the package size'); return; }
      const totalProtein = Number(document.getElementById('new-food-total-protein').value)||0;
      const totalCarbs = Number(document.getElementById('new-food-total-carbs').value)||0;
      const totalFat = Number(document.getElementById('new-food-total-fat').value)||0;
      const totalCalInput = document.getElementById('new-food-total-cal').value;
      // If total calories isn't given, calculate it from macros (4 kcal/g protein & carbs, 9 kcal/g fat) —
      // the standard estimation formula, close to but not always identical to a label's exact printed number.
      const totalCal = totalCalInput!=='' ? Number(totalCalInput) : (totalProtein*4 + totalCarbs*4 + totalFat*9);
      const ratio = 100/size;
      cal = Math.round(totalCal*ratio);
      protein = Math.round(totalProtein*ratio*10)/10;
      carbs = Math.round(totalCarbs*ratio*10)/10;
      fat = Math.round(totalFat*ratio*10)/10;
    }else{
      cal = document.getElementById('new-food-cal').value;
      protein = document.getElementById('new-food-protein').value;
      carbs = document.getElementById('new-food-carbs').value;
      fat = document.getElementById('new-food-fat').value;

/* ============================= INIT ============================= */
// Runs once on page load, and again every time auth state changes (login, logout, token
// refresh) — the single source of truth for "are we logged in, and if so, whose data is this."
registerServiceWorker();
sb.auth.onAuthStateChange((event, session)=>{
  if(session && session.user){
    const isNewLogin = !state._authUser || state._authUser.id !== session.user.id;
    state._authUser = session.user;
    if(isNewLogin) loadUserData();
    else render();
  }else{
    state._authUser = null;
    render();
  }
});
render(); // shows the auth screen immediately while the session check above resolves
